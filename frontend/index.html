<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan a truck trip under FMCSA Hours of Service: route, rest stops and filled-in Driver's Daily Log sheets." />
    <meta name="theme-color" content="#222831" />
    <script>
      // Apply the saved theme before first paint (Night Haul by default) to avoid a flash.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('hos.theme') === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>HOS Trip Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
